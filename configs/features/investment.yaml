investment:
  # FinBERT model for sentiment ensemble
  finbert_model: "ProsusAI/finbert"
  finbert_max_length: 512

  # TF-IDF keyword extraction
  tfidf_top_n: 20
  tfidf_max_features: 10000
  tfidf_ngram_min: 1
  tfidf_ngram_max: 2
  tfidf_sublinear_tf: true
  # Additional domain-specific stopwords (merged with built-in finance stopwords)
  tfidf_finance_stopwords:
    - "business"
    - "market"
    - "management"
    - "discussion"
    - "analysis"
    - "significant"
    - "material"
    - "applicable"
    - "including"
    - "certain"
    - "respect"
    - "following"
    - "general"

  # KeyBERT keyphrase extraction
  keybert_top_n: 10
  keybert_ngram_min: 1
  keybert_ngram_max: 3
  keybert_model: "all-MiniLM-L6-v2"

  # BERTopic
  bertopic_model: "all-MiniLM-L6-v2"
  bertopic_min_topic_size: 5

  # Extractive summarization (TextRank via sumy)
  summary_sentence_count: 5

  # Flag thresholds
  flag_litigation_ratio: 0.05
  flag_uncertainty_ratio: 0.08
  flag_fls_ratio: 0.15
  flag_yoy_delta_threshold: 15.0

  # Tier 2 context compression
  tier2_max_tokens: 4000

  # Feature version (for cache invalidation)
  feature_version: "1.2.0"

  # --- Input validation gate ---
  input_validation:
    required_sections: ["item_1", "item_1a", "item_7", "item_8"]
    recommended_sections: ["item_1b", "item_1c", "item_2", "item_7a"]
    min_section_words: 50
    boilerplate_phrases:
      - "this page intentionally left blank"
      - "not applicable"
      - "none"
      - "the information required by this item"
      - "incorporated by reference"
    boilerplate_max_ratio: 0.80
    halt_on_failure: false

  # --- Signal quality sub-configs (ADR-022) ---

  # Finance-domain stopwords (Phase 1.1 from ADR-022)
  stopwords:
    finance_terms:
      - "company"
      - "corporation"
      - "operations"
      - "financial"
      - "results"
      - "shall"
      - "hereby"
      - "pursuant"
      - "section"
      - "amendment"
      - "filed"
      - "thereof"
      - "therein"
      - "thereon"
      - "herein"
      - "fiscal"
      - "quarter"
      - "respectively"
      - "approximately"
      - "consolidated"
      - "statements"
      - "related"
      - "reported"
      - "included"
      - "period"
      - "ended"
      - "item"
      - "form"
      - "act"
      - "part"
      - "note"
      - "notes"
      - "total"
      - "amounts"
      # SEC boilerplate phrases (bigrams matched by ngram_range=2)
      - "forward looking"
      - "looking statements"
      - "safe harbor"
      - "actual results"
      - "differ materially"
      - "risk factors"
      - "annual report"
      - "exchange commission"
      - "securities exchange"
      - "exchange act"
      - "fiscal year"
      - "year ended"
      - "incorporated herein"
      - "common stock"
      # SEC structural terms (generic across all 10-Ks)
      - "registrant"
      - "exhibit"
      - "filing"
      - "securities"
      - "commission"
      - "annual"
      - "report"
      - "described"
    replace_defaults: false

  # NER post-processing
  ner:
    product_names:
      - "Mac"
      - "MacBook"
      - "iPad"
      - "iPhone"
      - "iMac"
      - "Apple Watch"
      - "Apple TV"
      - "Apple Vision"
      - "Apple Music"
      - "Apple Pay"
      - "Apple Card"
      - "Apple Arcade"
      - "Apple News"
      - "Apple Fitness"
      - "Apple Intelligence"
      - "AirPods"
      - "AirTag"
      - "HomePod"
      - "Beats"
      - "Safari"
      - "App Store"
      - "iCloud"
      - "Siri"
      - "macOS"
      - "iOS"
      - "iPadOS"
      - "watchOS"
      - "tvOS"
      - "visionOS"
    min_entity_length: 2
    regulatory_bodies:
      - "SEC"
      - "FASB"
      - "PCAOB"
      - "FINRA"
      - "OCC"
      - "FDIC"
      - "CFTC"
      - "DOJ"
      - "FTC"
      - "EPA"
      - "FDA"
      - "CFPB"
      - "FHFA"
      - "NCUA"

  # Going concern detection
  going_concern:
    enabled_sections:
      - "item_8"
      - "item_1a"
      - "item_7"
    auditor_opinion_sections:
      - "item_8"

  # Cybersecurity flag
  cybersecurity:
    incident_terms:
      - "breach"
      - "ransomware"
      - "phishing"
      - "malware"
      - "unauthorized access"
      - "data breach"
      - "cyber attack"
      - "cyber incident"
      - "security incident"

  # Summarizer domain re-scoring
  summarizer:
    boilerplate_patterns:
      - "in our opinion"
      - "we have audited"
      - "we audited"
      - "registered with the PCAOB"
      - "in accordance with the standards"
      - "in accordance with standards"
      - "present fairly"
      - "we are a public accounting firm"
      - "we are public accounting firm"
      - "conducted our audits in accordance"
      - "conducted our audit in accordance"
    finding_keywords:
      - "material weakness"
      - "going concern"
      - "significant deficienc"
      - "adverse"
      - "qualified opinion"
      - "contingent"
      - "litigation"
      - "restatement"
      - "impairment"
      - "write-down"
      - "charge of"
    finding_boost: 0.3
    finding_boost_cap: 0.9
    boilerplate_penalty: 0.5
    candidate_multiplier: 3

  # Tier 2 anomaly thresholds
  anomaly_thresholds:
    uncertainty_median_multiplier: 2.0
    uncertainty_absolute: 0.03
    litigious_median_multiplier: 2.0
    litigious_absolute: 0.02
    obfuscation_score: 80.0
    fls_ratio: 0.30
    negative_sentiment: -0.03
